name: Build plugin

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bun run build

      - run: |
          test -f dist/package.json
          test -f dist/README.md
          test -f dist/LICENSE
          test -f dist/main/index.js
          test -f dist/preload/index.js
          test -f dist/renderer/index.js
          test "$(bun -e 'console.log(require("./dist/package.json").version)')" = "0.0.0"
